[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools", "wheel"]

[project]
authors = [{name = "Emmanuel Schalk", email = "emmanuelschalk@gmail.com"}]
dependencies = [
  "compact_json",
  "flask",
  "flask_cors",
  "pandas",
  "plotly",
  "openpyxl",
  "sqlglot",
  "xlsxwriter",
]
description = "A Python package for communicating across cultures."
license = {text = "MIT"}
name = "keg2"
readme = "README.md"
requires-python = ">=3.10"
version = "0.85.1"

[project.optional-dependencies]
test = [
  "pytest",
  "pytest-cov",
]

[project.scripts]
keg2_app = "listen:listen_main"

[tool.black]
line-length = 88
skip-string-normalization = true
target-version = ["py311"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version = "0.1.0"

[tool.isort]
combine_as_imports = true
line_length = 88
no_sections = true
profile = "black"

[tool.pytest.ini_options]
markers = ["build_tests: tests that run only when --build_tests is passed", "local_only: tests meant to run locally only, not in CI"]
norecursedirs = [
  "_ref",
  "__pycache__",
  ".git",
  ".venv",
  "dist",
  "build",
  "*.egg-info",
]
pythonpath = ["src"]
testpaths = ["src", "tests"]

[tool.semantic_release]
branch = "main"
build_command = ""
changelog_file = "CHANGELOG.md"
plugins = [
  "semantic_release.hooks.commit_parser",
  "semantic_release.hooks.tag_formatter",
]
tag_format = "v{version}"
upload_to_pypi = false
version_variable = "keg/__init__.py:__version__"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["listen"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "**/*.json", "**/*.yaml"]

[tool.setuptools.packages.find]
where = ["src"]
